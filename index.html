<style>
:root{--paper:#2a1d15;--ink:#efe3d0;--spine:#a9b97a;--marker:#d9a441;--muted:#b3a18a;--line:#4a3628;--soft:#3a2a1f;--serif:'Newsreader',Georgia,serif;--sans:'Figtree',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--paper:#f1e8d9;--ink:#3a2a1e;--spine:#6b7d3f;--marker:#b9822a;--muted:#7a6650;--line:#d9ccb6;--soft:#e8dcc6}}
:root[data-theme="light"]{--paper:#f1e8d9;--ink:#3a2a1e;--spine:#6b7d3f;--marker:#b9822a;--muted:#7a6650;--line:#d9ccb6;--soft:#e8dcc6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--sans)}
.app{max-width:36rem;margin:0 auto;padding:1.25rem 1rem 7rem}
h1{font:700 2rem/1.15 var(--serif);margin:.5rem 0 .75rem}
h2{font:500 1.25rem var(--serif);margin:1.75rem 0 .5rem}
a{color:var(--spine)}
.by{margin:0;color:var(--muted)}
.progress{font:italic 500 1.25rem var(--serif);margin:.75rem 0}
.empty{color:var(--muted)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0 1rem}
button,input,select{font:inherit;color:inherit}
.chips button{border:1px solid var(--line);background:none;border-radius:99px;padding:.35rem .9rem;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
ul{list-style:none;padding:0;margin:0}
.book{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.85rem 0;cursor:pointer}
.book strong{display:block;font:700 1.1rem var(--serif)}
.book span{color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:.5rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--marker)}
.form{display:grid;gap:.9rem}
.form label{display:grid;gap:.25rem;font-weight:600;font-size:.9rem}
input,select{padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:transparent;width:100%;min-width:0;max-width:100%;font-size:16px}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:2.7rem;text-align:left}
select option{color:#3a2a1e;background:#f1e8d9}
.primary{background:var(--spine);color:var(--paper);border:0;border-radius:8px;padding:.7rem 1rem;font-weight:600;cursor:pointer}
.log{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5rem}
.log .primary{grid-column:1/-1}
.sess{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;padding:.6rem 0;border-bottom:1px solid var(--line);align-items:center}
.link{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0}
.danger{margin-top:2rem}
.back{margin-bottom:.5rem}

<script>
const KEY = 'booktracker:v1';
const SHELVES = ['reading', 'to-read', 'finished', 'resting'];
let data = { books: [], sessions: [], nextId: 1 };

// ---- Data version ----
// SCHEMA is the layout version of the saved data. Data saved before versioning existed counts as 1.
// To change the layout later: raise SCHEMA and add a step to MIGRATIONS (key = the new version number).
const SCHEMA = 2;
const MIGRATIONS = {
  // 3: d => { /* upgrade d from version 2 to 3 in place */ }
};
function migrate(src) {
  const d = (src && typeof src === 'object' && !Array.isArray(src)) ? src : {};
  const from = Number(d.v) || 1;
  for (let n = from + 1; n <= SCHEMA; n++) if (MIGRATIONS[n]) MIGRATIONS[n](d);
  const list = k => Array.isArray(d[k]) ? d[k].filter(x => x && typeof x === 'object') : [];
  d.books = list('books'); d.sessions = list('sessions'); d.notes = list('notes'); d.quotes = list('quotes');
  d.settings = Object.assign({ weeklyTarget: 3, goal: 12 }, d.settings && typeof d.settings === 'object' ? d.settings : {});
  const top = Math.max(0, ...[...d.books, ...d.sessions, ...d.notes, ...d.quotes].map(x => Number(x.id) || 0));
  d.nextId = Math.max(Number(d.nextId) || 1, top + 1);
  d.v = Math.max(from, SCHEMA);
  return d;
}

// ---- Storage warnings ----
const ISSUES = {
  blocked: 'This browser is not letting the app save anything (private browsing can cause this). Changes will be lost when you close the page. Save a backup to keep them.',
  full: 'Storage on this device is full, so your latest changes may not be kept. Save a backup now so nothing is lost. Big cover photos take the most room.',
  near: 'Storage is getting full. Save a backup soon, and consider smaller cover photos.',
  newer: 'This data was saved by a newer version of the app. To protect it, nothing will be saved here until you open the newest version.',
  corrupt: 'Your saved data could not be read, so the app started empty. A copy of the unreadable data was kept on this device.',
  corruptlock: 'Your saved data could not be read. To protect it, nothing will be saved until you load a backup.'
};
const NEAR_CHARS = 3500000; // roughly 70% of the usual 5 MB browser limit
let storeIssue = null, storeLocked = false, warnHidden = null;
const isFull = e => !!e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);
function drawWarn() {
  const el = document.getElementById('storewarn');
  if (!el) return;
  if (!storeIssue || warnHidden === storeIssue) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `<span>${ISSUES[storeIssue]}</span><span class="nbtn"><button class="primary" id="sw-go">Open Settings</button><button class="sx" id="sw-x" aria-label="Dismiss">&times;</button></span>`;
  document.getElementById('sw-go').onclick = () => go('settings');
  document.getElementById('sw-x').onclick = () => { warnHidden = storeIssue; drawWarn(); };
}

// ---- Load ----
(function loadData() {
  try { localStorage.setItem(KEY + ':probe', '1'); localStorage.removeItem(KEY + ':probe'); }
  catch (e) { storeIssue = isFull(e) ? 'full' : 'blocked'; }
  let raw = null, parsed = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { if (!storeIssue) storeIssue = 'blocked'; }
  if (raw) {
    try {
      parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('shape');
      const from = Number(parsed.v) || 1;
      if (from > SCHEMA) { storeLocked = true; storeIssue = 'newer'; }
      else if (Object.keys(MIGRATIONS).some(n => n > from && n <= SCHEMA)) {
        try { localStorage.setItem(KEY + ':before-v' + from, raw); } catch (e) {}
      }
    } catch (e) {
      parsed = null;
      let kept = false;
      try { localStorage.setItem(KEY + ':corrupt-' + Date.now(), raw); kept = true; } catch (e2) {}
      if (kept) { if (!storeIssue) storeIssue = 'corrupt'; } else { storeLocked = true; storeIssue = 'corruptlock'; }
    }
  }
  data = migrate(parsed || data);
  drawWarn();
})();

function save() {
  data.edits = (data.edits || 0) + 1; data.since = data.since || Date.now();
  if (storeLocked) return false;
  let json;
  try { json = JSON.stringify(data); localStorage.setItem(KEY, json); }
  catch (e) {
    const full = isFull(e);
    storeIssue = full ? 'full' : 'blocked'; drawWarn();
    say(full ? 'Storage is full, so that change was not saved.' : 'This browser would not save that change.');
    return false;
  }
  if (storeIssue === 'full' || storeIssue === 'blocked') storeIssue = null;
  if (json.length > NEAR_CHARS) { if (!storeIssue) storeIssue = 'near'; } else if (storeIssue === 'near') storeIssue = null;
  drawWarn();
  return true;
}
const today = () => new Date().toLocaleDateString('en-CA');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const unitOf = b => b.format === 'audio' ? 'min' : 'pages';
const readOf = id => data.sessions.filter(s => s.bookId === id).reduce((n, s) => n + s.pages, 0);

let view = 'home', tab = 'reading', openId = null;
const app = document.getElementById('app');
const go = (v, id) => { sheetOpen = false; clearInterval(tick); view = v; openId = id ?? null; render(); window.scrollTo(0, 0); };

function render() {
  saveTimer();
  applyCosmetics();
  const t = ['book', 'add', 'journal'].includes(view) ? 'library' : view === 'calendar' || view === 'timer' ? 'home' : view;
  ['home', 'library', 'awards', 'settings'].forEach(v => document.getElementById('n-' + (v === 'library' ? 'lib' : v)).className = v === t ? 'on' : '');
  if (view === 'home') return renderHome();
  if (view === 'add') return renderAdd();
  if (view === 'timer') return renderTimer();
  if (view === 'journal') return renderJournal();
  if (view === 'awards') return renderAwards();
  if (view === 'calendar') return renderCalPage();
  if (view === 'settings') return renderSettings();
  if (view === 'book') return renderBook();
  renderLibrary();
}

const SHELF_LABEL = { reading: 'Reading', 'to-read': 'To read', finished: 'Finished', resting: 'Resting' };
let lq = '', lsort = 'recent', sheetOpen = false, showAllSess = false, addStep = 'find', draft = null;
const shortDate = k => parse(k).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const dayLabel = k => parse(k).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const covHtml = (b, cls, col) => `<span class="gcov ${cls || ''} ${b.cover ? 'img' : ''}" style="background-color:${col || BOOKCOVERS[b.id % BOOKCOVERS.length]};${cvStyle(b.cover)}">${b.cover ? '' : `<span class="gtt">${esc(b.title || 'Untitled')}</span><span class="gau">${esc(b.authors || '')}</span>`}</span>`;
const recentKey = b => data.sessions.reduce((m, x) => x.bookId === b.id ? Math.max(m, x.createdAt) : m, 0) || b.id;
const pctOf = b => b.totalPages ? Math.min(100, Math.round(readOf(b.id) / b.totalPages * 100)) : 0;
function metaOf(b) {
  if (b.status === 'reading') return b.totalPages ? pctOf(b) + '% read' : 'Reading';
  if (b.status === 'finished') return (b.rating ? '&#9733; ' + (Math.round(b.rating * 10) / 10) + ' &middot; ' : '') + (b.finishedAt ? shortDate(b.finishedAt) : 'Finished');
  return b.status === 'resting' ? 'Paused' : 'On your list';
}
const SRCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.500 4.500"/></svg>';
const LISTICON = '<svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>';
const GRIDICON = '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="6" height="6" rx="1"/><rect x="13" y="5" width="6" height="6" rx="1"/><rect x="5" y="13" width="6" height="6" rx="1"/><rect x="13" y="13" width="6" height="6" rx="1"/></svg>';
const EMPTY = { reading: ['Nothing on your reading shelf', 'Tap the + button to add what you are reading.'], 'to-read': ['Your list is empty', 'Add books you want to read next.'], finished: ['No finished books yet', 'Books you finish will line up here.'], resting: ['Nothing paused', 'Books you set aside will wait here.'] };
function libBooks() {
  const q = lq.trim().toLowerCase();
  let l = q ? data.books.filter(b => (b.title + ' ' + (b.authors || '')).toLowerCase().includes(q)) : data.books.filter(b => b.status === tab);
  if (lsort === 'az') return [...l].sort((a, b) => a.title.localeCompare(b.title));
  if (lsort === 'rating') return [...l].sort((a, b) => (b.rating || 0) - (a.rating || 0));
  return [...l].sort((a, b) => recentKey(b) - recentKey(a));
}
function libListHtml() {
  const l = libBooks(), grid = (data.settings.libView || 'grid') === 'grid';
  if (!l.length) return lq ? '<div class="emptyc"><b>No matches</b><span>Try another title or author.</span></div>' : `<div class="emptyc"><b>${EMPTY[tab][0]}</b><span>${EMPTY[tab][1]}</span></div>`;
  const bar = b => b.status === 'reading' && b.totalPages ? `<span class="gpb"><i style="width:${pctOf(b)}%"></i></span>` : '';
  return grid
    ? `<div class="lgrid">${l.map(b => `<button class="gc" data-open="${b.id}" aria-label="${esc(b.title)}">${covHtml(b)}${bar(b)}<span class="gm">${metaOf(b)}</span></button>`).join('')}</div>`
    : `<div class="llist">${l.map(b => `<button class="lr" data-open="${b.id}">${covHtml(b, 'sm')}<span class="lt"><b>${esc(b.title)}</b><small>${esc(b.authors || '')}</small><span class="lm">${lq ? SHELF_LABEL[b.status] + ' &middot; ' : ''}${metaOf(b)}</span>${bar(b)}</span></button>`).join('')}</div>`;
}
function renderLibrary() {
  if (libTab === 'journal') return renderJournal();
  const n = data.books.length, grid = (data.settings.libView || 'grid') === 'grid';
  app.innerHTML = `<div class="lhead"><h1>Library</h1><span class="lcount">${n} ${n === 1 ? 'book' : 'books'}</span></div>${libSeg()}
    <div class="lbar"><label class="search">${SRCH}<input id="lq" type="search" placeholder="Search your books" value="${esc(lq)}"></label>
      <select id="ls" class="sortsel" aria-label="Sort"><option value="recent">Recent</option><option value="az">A to Z</option><option value="rating">Rating</option></select>
      <button class="vt" id="lv" aria-label="Switch view">${grid ? LISTICON : GRIDICON}</button></div>
    <div class="stabs">${SHELVES.map(s => `<button data-tab="${s}" class="${s === tab && !lq ? 'on' : ''}">${SHELF_LABEL[s]}<em>${data.books.filter(b => b.status === s).length}</em></button>`).join('')}</div>
    <div id="llist">${libListHtml()}</div>
    <button class="fab" id="addb" aria-label="Add a book">+</button>`;
  const rebind = () => app.querySelectorAll('#llist [data-open]').forEach(el => el.onclick = () => go('book', Number(el.dataset.open)));
  rebind();
  document.getElementById('ls').value = lsort;
  document.getElementById('ls').onchange = e => { lsort = e.target.value; document.getElementById('llist').innerHTML = libListHtml(); rebind(); };
  document.getElementById('lq').oninput = e => { lq = e.target.value; document.getElementById('llist').innerHTML = libListHtml(); rebind(); app.querySelectorAll('[data-tab]').forEach(el => el.classList.toggle('on', el.dataset.tab === tab && !lq)); };
  document.getElementById('lv').onclick = () => { data.settings.libView = grid ? 'list' : 'grid'; save(); render(); };
  app.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { tab = el.dataset.tab; lq = ''; render(); });
  document.getElementById('addb').onclick = () => { addStep = 'find'; draft = null; go('add'); };
}
const stepperHtml = (n, unit) => `<div class="stp"><button type="button" class="stb" data-st="-1" aria-label="Less">&minus;</button><div class="stv"><input id="sn" type="number" inputmode="numeric" min="1" value="${n}"><span>${unit}</span></div><button type="button" class="stb" data-st="1" aria-label="More">+</button></div><div class="qk">${[5, 10, 25, 50].map(v => `<button type="button" data-q="${v}">+${v}</button>`).join('')}</div>`;
function bindStepper(root) {
  const inp = root.querySelector('#sn'), set = v => { inp.value = Math.max(1, Math.round(v || 1)); };
  root.querySelectorAll('[data-st]').forEach(b => b.onclick = () => set((Number(inp.value) || 0) + Number(b.dataset.st)));
  root.querySelectorAll('[data-q]').forEach(b => b.onclick = () => set((Number(inp.value) || 0) + Number(b.dataset.q)));
}
function renderAdd() {
  if (!draft) draft = { title: '', authors: '', pages: '', format: 'print', status: 'reading', cover: '' };
  if (addStep === 'details') return addDetails();
  app.innerHTML = `<button class="link back" id="abk">&lsaquo; Library</button><h1>Add a book</h1><p class="by">Search for it, or enter the details yourself.</p>
    <div class="finder2"><label class="search big">${SRCH}<input id="q" type="search" placeholder="Title, author or ISBN"></label><button class="cta" id="qgo">Search</button></div>
    <div id="sr"></div><button class="ghostwide" id="manual">Enter details manually</button>`;
  document.getElementById('abk').onclick = () => go('library');
  document.getElementById('manual').onclick = () => { addStep = 'details'; render(); };
  const run = async () => {
    const q = document.getElementById('q').value.trim(), box = document.getElementById('sr');
    if (!q) return;
    box.innerHTML = '<p class="by" style="margin:1rem 0">Searching...</p>';
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(q) + '&limit=8&fields=title,author_name,number_of_pages_median,cover_i', { signal: ctl.signal });
      clearTimeout(tm);
      const docs = (await r.json()).docs || [];
      box.innerHTML = docs.length ? docs.map((d, i) => `<button type="button" class="res" data-i="${i}"><span class="gcov sm img" style="${cvStyle(d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-S.jpg' : '')}background-color:var(--line)"></span><span class="lt"><b>${esc(d.title)}</b><small>${esc((d.author_name || [])[0] || '')}${d.number_of_pages_median ? ' &middot; ' + d.number_of_pages_median + ' pages' : ''}</small></span></button>`).join('') : '<div class="emptyc"><b>No matches</b><span>Try different words, or enter it manually.</span></div>';
      box.querySelectorAll('.res').forEach(h => h.onclick = () => {
        const d = docs[Number(h.dataset.i)];
        draft = { title: d.title, authors: (d.author_name || [])[0] || '', pages: d.number_of_pages_median || '', format: 'print', status: 'reading', cover: d.cover_i ? 'https://covers.openlibrary.org/b/id/' + d.cover_i + '-M.jpg' : '' };
        addStep = 'details'; render();
      });
    } catch (x) { box.innerHTML = '<div class="emptyc"><b>Search is not available here</b><span>It works in the GitHub version. You can still add the book yourself.</span></div>'; }
  };
  document.getElementById('qgo').onclick = run;
  document.getElementById('q').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); run(); } };
}
function addDetails() {
  const d = draft, col = BOOKCOVERS[data.nextId % BOOKCOVERS.length];
  const pills = (id, opts, cur) => `<div class="pills" id="${id}">${opts.map(([v, t]) => `<button type="button" data-v="${v}" class="${cur === v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  app.innerHTML = `<button class="link back" id="abk">&lsaquo; Back</button>
    <div class="dhero"><div id="dcov">${covHtml(d, 'lg', col)}</div><button class="ghost sm2" id="cvb" type="button">${d.cover ? 'Change cover' : 'Add cover photo'}</button><input type="file" id="cvf" accept="image/*" hidden></div>
    <div class="fcard"><input class="ft1" id="dt" placeholder="Title" value="${esc(d.title)}"><input class="ft2" id="da" placeholder="Author" value="${esc(d.authors)}"></div>
    <p class="lab">Format</p>${pills('dfm', [['print', 'Print'], ['ebook', 'E-book'], ['audio', 'Audiobook']], d.format)}
    <p class="lab">Shelf</p>${pills('dst', [['reading', 'Reading now'], ['to-read', 'Want to read'], ['finished', 'Finished']], d.status)}
    <p class="lab" id="dpl">${d.format === 'audio' ? 'Length in minutes' : 'Number of pages'} <span>(optional)</span></p>
    <input id="dp" type="number" inputmode="numeric" min="1" value="${d.pages || ''}" placeholder="e.g. 320">
    <button class="cta wide" id="dsave">Add to library</button>`;
  const upd = () => { document.getElementById('dcov').innerHTML = covHtml(d, 'lg', col); };
  document.getElementById('abk').onclick = () => { addStep = 'find'; render(); };
  document.getElementById('dt').oninput = e => { d.title = e.target.value; upd(); };
  document.getElementById('da').oninput = e => { d.authors = e.target.value; upd(); };
  document.getElementById('dp').oninput = e => { d.pages = e.target.value; };
  const wire = (id, key, after) => document.querySelectorAll('#' + id + ' button').forEach(bn => bn.onclick = () => { d[key] = bn.dataset.v; document.querySelectorAll('#' + id + ' button').forEach(x => x.classList.toggle('on', x === bn)); if (after) after(); });
  wire('dfm', 'format', () => { document.getElementById('dpl').firstChild.textContent = d.format === 'audio' ? 'Length in minutes ' : 'Number of pages '; });
  wire('dst', 'status');
  document.getElementById('cvb').onclick = () => document.getElementById('cvf').click();
  document.getElementById('cvf').onchange = async e => { const fl = e.target.files[0]; if (!fl) return; try { d.cover = await fileToCover(fl); try { d.col = await coverAvg(d.cover); } catch (y) { d.col = ''; } render(); } catch (x) { say('Could not read that image.'); } };
  document.getElementById('dsave').onclick = () => {
    if (!d.title.trim()) { say('Add a title first.'); document.getElementById('dt').focus(); return; }
    const b = { id: data.nextId++, title: d.title.trim(), authors: (d.authors || '').trim(), totalPages: d.pages ? Number(d.pages) : undefined, format: d.format, status: d.status };
    if (d.cover) b.cover = d.cover;
    if (d.col) b.col = d.col;
    if (b.status === 'reading') b.startedAt = today();
    if (b.status === 'finished') b.finishedAt = today();
    data.books.push(b); draft = null; addStep = 'find'; save(); go('book', b.id);
  };
}
function sheetHtml(b) {
  const last = data.sessions.filter(s => s.bookId === b.id && !s.estimated).sort((x, y) => y.createdAt - x.createdAt)[0];
  return `<div class="sheetbg" id="sbg"><div class="sheet" role="dialog" aria-label="Log reading"><div class="grab"></div><div class="sh"><h3>Log reading</h3><button class="x" id="sx" aria-label="Close">&times;</button></div><p class="by">${esc(b.title)}</p>${stepperHtml(last ? last.pages : 20, unitOf(b))}
    <p class="lab">When</p><div class="pills" id="sdt"><button type="button" data-d="0" class="on">Today</button><button type="button" data-d="1">Yesterday</button><button type="button" data-d="x">Other day</button></div><input id="sdi" type="date" hidden max="${today()}" value="${today()}">
    ${b.status === 'reading' ? '<label class="chk"><input type="checkbox" id="sfin"> I finished this book</label>' : ''}
    <button class="cta wide" id="ssave">Save session</button></div></div>`;
}
function renderBook() {
  const b = data.books.find(x => x.id === openId);
  if (!b) return go('library');
  const sess = data.sessions.filter(s => s.bookId === b.id).sort((x, y) => y.date.localeCompare(x.date) || y.createdAt - x.createdAt);
  const u = unitOf(b), notes = data.notes.filter(n => n.bookId === b.id).sort((x, y) => y.createdAt - x.createdAt);
  const read = readOf(b.id), pct = pctOf(b), days = new Set(sess.map(s => s.date)).size;
  app.innerHTML = `<div class="bnav"><button class="link back" id="back">&lsaquo; Library</button><button class="link" id="chc">${b.cover ? 'Change cover' : 'Add cover'}</button></div><input type="file" id="chf" accept="image/*" hidden>
    <div class="bhero">${covHtml(b, 'lg')}<h1>${esc(b.title)}</h1><p class="by">${esc(b.authors || '')}</p>
      <div class="stars">${[1, 2, 3, 4, 5].map(i => `<button data-star="${i}" class="${b.rating && i <= Math.round(b.rating) ? 'on' : ''}" aria-label="${i} stars">&#9733;</button>`).join('')}</div></div>
    <div class="pills center" id="bst">${SHELVES.map(s => `<button data-s="${s}" class="${s === b.status ? 'on' : ''}">${SHELF_LABEL[s]}</button>`).join('')}</div>
    <section class="card prog"><div class="pgt"><b>${read}</b><span>${b.totalPages ? ' of ' + b.totalPages : ''} ${u}</span>${b.totalPages ? `<em>${pct}%</em>` : ''}</div>${b.totalPages ? `<div class="bar big"><i style="width:${pct}%"></i></div>` : ''}
      <div class="mini"><span><b>${sess.length}</b>sessions</span><span><b>${days}</b>days</span><span><b>${b.startedAt ? shortDate(b.startedAt) : '-'}</b>started</span></div></section>
    <div class="row"><button class="cta" id="logb">Log reading</button><button class="ghostwide" id="tmr">Start timer</button></div>
    <h2>Notes</h2>
    <div class="card comp"><div class="pills sm" id="nt"><button type="button" data-v="quote" class="on">Quote</button><button type="button" data-v="reflection">Reflection</button></div><textarea id="nx" placeholder="A line you loved, or what you are thinking"></textarea><div class="rt"><button class="cta sm" id="nsave">Save note</button></div></div>

document.getElementById('n-awards').onclick = () => go('awards');
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const IMP_ALIASES = { title: ['title'], authors: ['authors', 'author'], isbn: ['isbn/uid', 'isbn13', 'isbn'], format: ['format', 'binding'], status: ['read status', 'exclusive shelf'], added: ['date added'], range: ['dates read'], date: ['date read', 'last date read'], rating: ['star rating', 'my rating'], pages: ['number of pages'] };
function buildImport(rows) {
  const head = rows[0].map(h => h.trim().toLowerCase()), ix = {};
  Object.keys(IMP_ALIASES).forEach(k => { ix[k] = -1; for (const a of IMP_ALIASES[k]) { const i = head.indexOf(a); if (i >= 0) { ix[k] = i; break; } } });
  if (ix.title < 0) throw new Error('no title column');
  const get = (r, k) => ix[k] >= 0 ? (r[ix[k]] || '').trim() : '';
  const iso = v => { const m = v.match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/); return m ? m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0') : ''; };
  const fmt = { digital: 'ebook', ebook: 'ebook', 'kindle edition': 'ebook', audio: 'audio', audiobook: 'audio' };
  const st = { read: 'finished', 'currently-reading': 'reading', 'to-read': 'to-read', paused: 'resting', 'did-not-finish': 'resting' };
  const items = rows.slice(1).map(r => {
    const title = get(r, 'title'); if (!title) return null;
    const ds = (get(r, 'range').match(/\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/g) || []).map(iso), one = iso(get(r, 'date'));
    const start = ds[0] || one, end = ds[1] || ds[0] || one;
    const isbn = get(r, 'isbn').replace(/[^0-9Xx]/g, '').toUpperCase(), pg = parseInt(get(r, 'pages'), 10);
    return { title, authors: get(r, 'authors'), isbn: isbn.length === 10 || isbn.length === 13 ? isbn : '', format: fmt[get(r, 'format').toLowerCase()] || 'print', status: st[get(r, 'status').toLowerCase()] || (end ? 'finished' : 'to-read'), start, end, added: iso(get(r, 'added')), rating: parseFloat(get(r, 'rating')) || 0, pages: pg > 0 ? pg : 0 };
  }).filter(Boolean);
  const key = (t, a) => (t + '|' + a).toLowerCase();
  const have = new Set(data.books.map(b => key(b.title, b.authors))), haveI = new Set(data.books.filter(b => b.isbn).map(b => b.isbn));
  items.forEach(it => { it.dup = !!((it.isbn && haveI.has(it.isbn)) || have.has(key(it.title, it.authors))); });
  return { items };
}
let pendingImport = null;
function loadImportFile(file) {
  const r = new FileReader();
  r.onload = () => { try { pendingImport = buildImport(parseCSV(String(r.result))); if (!pendingImport.items.length) throw new Error('empty'); } catch (e) { pendingImport = null; say('Could not read books from that file.'); } render(); };
  r.readAsText(file);
}
function applyImport() {
  const est = document.getElementById('im-est-on').checked, ppb = Math.max(20, Number(document.getElementById('im-ppb').value) || 250);
  const before = totalXp(); let nb = 0;
  pendingImport.items.filter(it => !it.dup).forEach(it => {
    const b = { id: data.nextId++, title: it.title, authors: it.authors, format: it.format, status: it.status, imported: true };
    if (it.isbn) b.isbn = it.isbn;
    if (it.rating) b.rating = it.rating;
    if (it.pages) b.totalPages = it.pages;
    const s0 = it.start || it.added;
    if (s0 && it.status !== 'to-read') b.startedAt = s0;
    if (it.status === 'finished' && it.end) b.finishedAt = it.end;
    if (est && it.status === 'finished' && it.start && it.end) {
      let a = parse(it.start), z = parse(it.end); if (z < a) [a, z] = [z, a];
      const days = []; for (const d = new Date(a); d <= z && days.length < 120; d.setDate(d.getDate() + 1)) days.push(ymd(d));
      const total = it.pages || ppb, per = Math.floor(total / days.length);
      if (!it.pages) { b.totalPages = ppb; b.estPages = true; }
      days.forEach((day, i) => { const pages = i === days.length - 1 ? total - per * (days.length - 1) : per; if (pages > 0) data.sessions.push({ id: data.nextId++, bookId: b.id, date: day, pages, xp: pages, createdAt: parse(day).getTime() + 43200000, imported: true, estimated: true }); });
    }
    data.books.push(b); nb++;

}
function undoImport() {

  const ids = new Set(data.books.filter(b => b.imported).map(b => b.id));
  data.books = data.books.filter(b => !ids.has(b.id));
  data.sessions = data.sessions.filter(x => !ids.has(x.bookId) && !x.estimated);

}
function removeEstimated() {

  data.sessions = data.sessions.filter(x => !x.estimated);

  save(); render();
}
let pendingBackup = null;
async function saveBackup() {
  const payload = JSON.stringify({ app: 'book-tracker', v: 1, savedAt: new Date().toISOString(), data });
  const name = 'everquinn-backup-' + today() + '.json';
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) await dl.save({ filename: name, data: payload });
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([payload], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  } catch (e) { say(e && e.code === 'declined' ? 'Backup cancelled.' : 'Could not save the backup here.'); return; }
  data.backup = { last: Date.now(), at: data.edits || 0 }; save(); say('Backup saved.'); render();
}
function loadBackupFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j || j.app !== 'book-tracker' || !j.data || !Array.isArray(j.data.books) || !Array.isArray(j.data.sessions)) throw new Error('bad');
      if ((Number(j.data.v) || 1) > SCHEMA) throw new Error('newer');

    } catch (e) { pendingBackup = null; say(e && e.message === 'newer' ? 'That backup is from a newer version of the app. Open the newest version to load it.' : 'That file is not an Everquinn backup.'); }
    render();
  };
  r.readAsText(file);
}
function applyBackup() {

  if (storeLocked) { storeLocked = false; storeIssue = null; }
  data = migrate(pendingBackup.data);

  pendingBackup = null; save(); go('home'); say('Backup loaded.');
}

  if (edits < 1 || days < 14 || Date.now() < (data.nudgeUntil || 0)) return '';
  return `<div class="nudge"><span>${b.last ? 'Your last backup was ' + Math.floor(days) + ' days ago.' : 'You have not saved a backup yet.'} Save one so nothing is lost.</span><span class="nbtn"><button class="primary" data-bk="save">Save backup</button><button class="link" data-bk="later">Later</button></span></div>`;
}

// Refresh when the app is reopened, or when the day, daylight or weather changes while it stays open.
// Only Home, Calendar and Progress redraw by themselves, so forms and half-typed text are never wiped.
const stamp = () => { const s = skyNow(); return [today(), s.phase, s.wx, isNight()].join('|'); };
let lastStamp = stamp();
function refreshIfStale() {
  const c = document.getElementById('tclk') || document.getElementById('clk');
  if (c && timer.since) c.textContent = fmt(elapsed());

}

const TOUR = [
  { view: 'home', nav: 'n-home', t: 'Home', d: 'Your reading nook. Start a timer, watch the window and your plant, and see finished books fill the shelf.' },
  { view: 'library', nav: 'n-lib', t: 'Library', d: 'All your books in one place. Tap + to add one, and keep notes and quotes in the Journal.' },
